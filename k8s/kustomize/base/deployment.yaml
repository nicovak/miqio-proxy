apiVersion: apps/v1
kind: Deployment
metadata:
  name: miqio-proxy
  labels:
    app: miqio-proxy
spec:
  selector:
    matchLabels:
      app: miqio-proxy
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      name: miqio-proxy
      labels:
        app: miqio-proxy
    spec:
      containers:
        - name: server
          command: [ "./miqio-proxy" ]
          args: [ "server" ]
          image: ghcr.io/nicovak/miqio-proxy
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
          envFrom:
            - configMapRef:
                name: miqio-proxy-config
            - secretRef:
                name: miqio-proxy-secrets
      # initContainers:
      #   - name: migrate
      #     command: [ "./miqio-proxy" ]
      #     args: [ "migrate" ]
      #     image: ghcr.io/nicovak/miqio-proxy
      #     imagePullPolicy: IfNotPresent
      #     resources:
      #     envFrom:
      #       - configMapRef:
      #           name: miqio-proxy-config
      #       - secretRef:
      #           name: miqio-proxy-secrets
      restartPolicy: Always
      imagePullSecrets:
        - name: regcred
